server:
  port: 8083

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Each service checks the token itself, so calls that skip the gateway are rejected.
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs
  data:
    mongodb:
      uri: mongodb://localhost:27017/fitnessrecommendation
      database: fitnessrecommendation
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  ai:
    # Disable Spring AI chat auto-config: it refuses empty API keys. GeminiAiConfig
    # creates ChatClient only when gemini.api.key is set.
    model:
      chat: none


eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


gemini:
  api:
    key: ${GEMINI_API_KEY:}
    # Override with GEMINI_MODEL when Google retires a model name.
    model: ${GEMINI_MODEL:gemini-2.5-flash}