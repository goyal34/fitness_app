server:
  port: 8083

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Each service checks the token itself, so calls that skip the gateway are rejected.
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs
  data:
    mongodb:
      uri: mongodb://localhost:27017/fitnessrecommendation
      database: fitnessrecommendation
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


gemini:
  api:
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=}
    key: ${GEMINI_API_KEY:}