spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Each service checks the token itself, so calls that skip the gateway are rejected.
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs
  application:
    name: activity-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/fitnessactivity
      database: fitnessactivity
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # The outbox publisher waits for RabbitMQ to confirm each message, and
    # treats a message that reaches no queue (returned) as a failure.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

outbox:
  publisher:
    interval-ms: 2000   # how often to look for pending events
    batch-size: 50      # max events sent per run
    max-attempts: 10    # then the event is marked FAILED
