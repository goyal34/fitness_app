server:
  port: 8081

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Each service checks the token itself, so calls that skip the gateway are rejected.
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_user_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/